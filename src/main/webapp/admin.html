<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="admin-wrap">
    <div class="admin-sidebar">
      <div class="wf-logo" style="text-align:center;">BITES &amp; MORE</div>
      <div style="font-size:11px;text-transform:uppercase;color:#777;padding:0 24px;margin-bottom:10px;">Main Menu</div>
      <div class="admin-nav-item ${act?'active':''}"
      <div style="margin-top:40px;border-top:1px solid #000;"></div>
        <div class="admin-nav-item">Log Out</div>
      </div>
    </div>

    <div class="admin-main">
      <div class="admin-topbar">
        <div>
          <div style="font-size:22px;font-weight:bold;">Dashboard Overview</div>
          <div style="font-size:13px;color:#666;">Welcome back, Admin</div>
        </div>
        <div style="display:flex;align-items:center;gap:20px;">
          <div class="input" style="display:flex;align-items:center;gap:8px;color:#777;width:240px;">${I('search',16)} Search...</div>
          <span class="ic-btn">${I('mail',20)}<span class="badge">5</span></span>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="img-ph" style="width:40px;height:40px;border-radius:50%;">Img</div>
            <span style="font-size:13px;font-weight:bold;">Admin</span>
          </div>
        </div>
      </div>

      <div class="row" style="margin-bottom:24px;">
          <div class="stat-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div class="label">${l}</div>
                <div class="value">${v}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row" style="margin-bottom:24px;">
        <div class="col-8">
          <div class="chart-box">
            <!-- <div class="chart-bar" style="height:${h}%;"></div> -->
          </div>
          <div style="text-align:center;font-size:12px;color:#666;margin-top:10px;">Revenue Chart (Monthly)</div>
        </div>
        <div class="col-4">
          <div class="filter-block" style="height:320px;">
            <h5>Top Products</h5>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
              <div class="img-ph" style="width:44px;height:44px;flex-shrink:0;">Img</div>
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:bold;">${n}</div>
                <div style="font-size:12px;color:#666;">${p}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="filter-block">
        <h5>Latest Orders</h5>
        <table>
          <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead>
          <tbody>
          <tr><td>${id}</td><td>${c}</td><td>${d}</td><td>${a}</td><td><span class="tag">${s}</span></td><td style="display:flex;gap:10px;">${I('eye',16)}${I('edit',16)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
