<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section">
    <div class="section-title" style="text-align:left;margin-bottom:30px;">Shopping Cart (3 Items)</div>
    <div class="row">
      <div class="col-8">
        <table>
          <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead>
          <tbody>
          <tr>
            <td style="display:flex;align-items:center;gap:14px;">
              <div class="img-ph" style="width:70px;height:70px;">Image</div>
              <span style="font-weight:bold;">${n}</span>
            </td>
            <td>${p}</td>
            <td>
              <div style="display:flex;border:1px solid #000;width:110px;">
                <div style="padding:6px 12px;border-right:1px solid #000;">${I('minus',12)}</div>
                <div style="padding:6px 14px;">1</div>
                <div style="padding:6px 12px;border-left:1px solid #000;">${I('plus',12)}</div>
              </div>
            </td>
            <td style="font-weight:bold;">${p}</td>
            <td>${I('trash',18)}</td>
          </tr>
          </tbody>
        </table>
        <div style="display:flex;justify-content:space-between;margin-top:30px;">
          <div class="btn">${I('chevronLeft',14)} Continue Shopping</div>
          <div style="display:flex;gap:10px;">
            <input class="input" style="width:220px;" placeholder="Coupon Code">
            <div class="btn btn-dark">Apply Coupon</div>
          </div>
        </div>
      </div>

      <div class="col-4">
        <div class="filter-block">
          <h5>Order Summary</h5>
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px;"><span>Subtotal</span><span>$27.50</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px;"><span>Shipping</span><span>$5.00</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px;"><span>Discount</span><span>-$0.00</span></div>
          <hr class="rule" style="margin:14px 0;">
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:24px;"><span>Total</span><span>$32.50</span></div>
          <div class="btn btn-dark btn-block">Proceed to Checkout ${I('arrowRight',16)}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
