<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="section">
    <div style="display:flex;justify-content:center;gap:60px;margin-bottom:44px;">
      ${['Cart','Shipping','Payment','Confirmation'].map((s,i)=>`
        <div style="display:flex;align-items:center;gap:10px;">
          <!-- <div class="step-badge" style="${i<2?'background:#000;color:#fff;':''}">${i+1}</div> -->
          <span style="font-size:13px;font-weight:bold;">${s}</span>
        </div>`).join('')}
    </div>

    <div class="row">
      <div class="col-7">
        <div class="filter-block">
          <h5>Shipping Address</h5>
          <div class="row">
            <div class="col-6 field"><label>First Name</label><input class="input" placeholder="John"></div>
            <div class="col-6 field"><label>Last Name</label><input class="input" placeholder="Doe"></div>
          </div>
          <div class="field"><label>Address</label><input class="input" placeholder="Street address"></div>
          <div class="row">
            <div class="col-4 field"><label>City</label><input class="input" placeholder="City"></div>
            <div class="col-4 field"><label>State</label><input class="input" placeholder="State"></div>
            <div class="col-4 field"><label>Zip Code</label><input class="input" placeholder="00000"></div>
          </div>
          <div class="field"><label>Phone Number</label><input class="input" placeholder="(000) 000-0000"></div>
        </div>

        <div class="filter-block">
          <h5>Payment Method</h5>
          <div class="filter-row" style="margin-bottom:16px;">
            <span style="width:16px;height:16px;border:1.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;">${i===0?'<span style="width:8px;height:8px;background:#000;border-radius:50%;"></span>':''}</span>
          </div>
          <div class="row">
            <div class="col-12 field"><label>Card Number</label><input class="input" placeholder="0000 0000 0000 0000"></div>
            <div class="col-6 field"><label>Expiry Date</label><input class="input" placeholder="MM/YY"></div>
            <div class="col-6 field"><label>CVV</label><input class="input" placeholder="123"></div>
          </div>
        </div>
      </div>

      <div class="col-5">
        <div class="filter-block">
          <h5>Order Summary</h5>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;"><span>${n}</span><span>${p}</span></div>`).join('')}
          <hr class="rule" style="margin:14px 0;">
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;"><span>Subtotal</span><span>$27.50</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;"><span>Shipping</span><span>$5.00</span></div>
          <hr class="rule" style="margin:14px 0;">
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:24px;"><span>Total</span><span>$32.50</span></div>
          <div class="btn btn-dark btn-block">Confirm Order ${I('check',16)}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
