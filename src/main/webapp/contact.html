<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section" style="padding:0;">
    <div class="img-ph" style="height:220px;">Image (Map)</div>
  </div>
  <div class="section">
    <div class="section-title">Get In Touch</div>
    <div class="section-subtitle">We'd love to hear from you</div>
    <div class="row" style="margin-bottom:40px;">
        <div class="img-ph" style="height:64px;width:64px;border-radius:50%;margin:0 auto 14px;">${I(ic,22)}</div>
        <div style="font-weight:bold;margin-bottom:6px;">${t}</div>
        <div style="font-size:13px;color:#444;">${d}</div>
      </div>
    </div>
    <div class="row">
      <div class="col-6">
        <div class="img-ph" style="height:420px;">Image</div>
      </div>
      <div class="col-6">
        <div class="filter-block">
          <h5>Send Us a Message</h5>
          <div class="row">
            <div class="col-6 field"><label>Name</label><input class="input" placeholder="Your name"></div>
            <div class="col-6 field"><label>Email</label><input class="input" placeholder="you@example.com"></div>
          </div>
          <div class="field"><label>Subject</label><input class="input" placeholder="Subject"></div>
          <div class="field"><label>Message</label><textarea class="input" rows="5" placeholder="Write your message..."></textarea></div>
          <div class="btn btn-dark">Send Message</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
