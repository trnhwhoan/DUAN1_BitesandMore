<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section" style="display:flex;justify-content:center;padding:100px 80px;">
    <div style="width:480px;">
      <div class="img-ph" style="height:70px;width:70px;border-radius:50%;margin:0 auto 24px;">${I('lock',24)}</div>
      <div style="font-size:26px;font-weight:bold;text-align:center;margin-bottom:8px;">Reset Your Password</div>
      <div style="font-size:14px;color:#444;text-align:center;margin-bottom:32px;">Enter your email and we'll send you a reset link</div>
      <div class="filter-block">
        <div class="field"><label>Email Address</label><input class="input" placeholder="you@example.com"></div>
        <div class="btn btn-dark btn-block">Send Reset Link</div>
        <div style="text-align:center;margin-top:24px;font-size:13px;">${I('chevronLeft',12)} <a style="text-decoration:underline;">Back to Login</a></div>
      </div>
    </div>
  </div>
</body>
</html>
