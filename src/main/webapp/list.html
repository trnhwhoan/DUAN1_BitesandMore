<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="section" style="padding:40px 80px;">
    <div class="row">
      <div class="col-3">
        <div class="filter-block">
          <h5>Search</h5>
          <div class="input" style="display:flex;align-items:center;gap:8px;color:#777;">${I('search',16)} Search products...</div>
        </div>
        <div class="filter-block">
          <h5>Category</h5>
        <div class="filter-row">
            <span class="checkbox"></span>${c}</div>
        </div>
        <div class="filter-block">
          <h5>Price Range</h5>
          <div style="display:flex;gap:10px;margin-bottom:14px;">
            <input class="input" placeholder="Min">
            <input class="input" placeholder="Max">
          </div>
          <div class="img-ph" style="height:8px;"></div>
        </div>
        <div class="btn btn-dark btn-block">Apply Filters</div>
      </div>

      <div class="col-9">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
          <div style="font-size:14px;color:#444;">Showing 1-8 of 42 results</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:13px;font-weight:bold;">Sort By:</span>
            <div class="input" style="width:220px;display:flex;justify-content:space-between;align-items:center;">Popularity ${I('chevronDown',14)}</div>
          </div>
        </div>
        <div class="row">
         <div class="col-3" style="margin-bottom:24px;">${PRODUCT_CARD(n,p,r)}</div>
        </div>
        <div class="pagination">
          <div class="page-num">${I('chevronLeft',14)}</div>
          <div class="page-num active">1</div>
          <div class="page-num">2</div>
          <div class="page-num">3</div>
          <div class="page-num">${I('chevronRight',14)}</div>
        </div>
      </div>
    </div>
  </div>
