<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section">
    <div class="row">
      <div class="col-3">
        <div class="filter-block" style="text-align:center;">
          <div class="img-ph" style="height:120px;width:120px;border-radius:50%;margin:0 auto 16px;">Image</div>
          <div style="font-weight:bold;font-size:16px;">Jane Smith</div>
          <div style="font-size:12px;color:#666;margin-bottom:20px;">jane.smith@email.com</div>
          <div class="btn btn-sm btn-block">${I('upload',14)} Change Photo</div>
        </div>
        <div class="filter-block" style="padding:0;">
          <!-- <div class="admin-nav-item ${act?'active':''}" style="border-left:3px solid ${act?'#000':'transparent'};">${I(ic,18)} ${label}</div>`).join('')} -->
        </div>
      </div>

      <div class="col-9">
        <div class="filter-block">
          <h5>Personal Information</h5>
          <div class="row">
            <div class="col-6 field"><label>First Name</label><input class="input" placeholder="Jane"></div>
            <div class="col-6 field"><label>Last Name</label><input class="input" placeholder="Smith"></div>
          </div>
          <div class="row">
            <div class="col-6 field"><label>Email Address</label><input class="input" placeholder="jane.smith@email.com"></div>
            <div class="col-6 field"><label>Phone Number</label><input class="input" placeholder="(000) 000-0000"></div>
          </div>
          <div class="field"><label>Shipping Address</label><input class="input" placeholder="Street address"></div>
          <div class="btn btn-dark">Save Changes</div>
        </div>

        <div class="filter-block">
          <h5>Order History</h5>
          <table>
            <thead><tr><th>Order ID</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
            <tbody>
            <tr><td>${id}</td><td>${d}</td><td>${it}</td><td>${t}</td><td><span class="tag">${s}</span></td></tr>`).join('')}
            </tbody>
          </table>
        </div>

        <div class="filter-block">
          <h5>Change Password</h5>
          <div class="row">
            <div class="col-4 field"><label>Current Password</label><input class="input" placeholder="••••••••"></div>
            <div class="col-4 field"><label>New Password</label><input class="input" placeholder="••••••••"></div>
            <div class="col-4 field"><label>Confirm Password</label><input class="input" placeholder="••••••••"></div>
          </div>
          <div class="btn btn-dark">Update Password</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
