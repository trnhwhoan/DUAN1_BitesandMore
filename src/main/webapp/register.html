<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section" style="display:flex;justify-content:center;padding:80px 80px;">
    <div style="width:560px;">
      <div class="img-ph" style="height:70px;width:70px;border-radius:50%;margin:0 auto 24px;">${I('user',24)}</div>
      <div style="font-size:26px;font-weight:bold;text-align:center;margin-bottom:8px;">Create an Account</div>
      <div style="font-size:14px;color:#444;text-align:center;margin-bottom:32px;">Join Bites &amp; More for exclusive offers</div>
      <div class="filter-block">
        <div class="row">
          <div class="col-6 field"><label>First Name</label><input class="input" placeholder="John"></div>
          <div class="col-6 field"><label>Last Name</label><input class="input" placeholder="Doe"></div>
        </div>
        <div class="field"><label>Email Address</label><input class="input" placeholder="you@example.com"></div>
        <div class="field"><label>Phone Number</label><input class="input" placeholder="(000) 000-0000"></div>
        <div class="row">
          <div class="col-6 field"><label>Password</label><input class="input" placeholder="••••••••"></div>
          <div class="col-6 field"><label>Confirm Password</label><input class="input" placeholder="••••••••"></div>
        </div>
        <div class="filter-row" style="margin-bottom:24px;"><span class="checkbox"></span>I agree to the Terms &amp; Conditions</div>
        <div class="btn btn-dark btn-block">Create Account</div>
        <div style="text-align:center;margin-top:24px;font-size:13px;">Already have an account? <a style="text-decoration:underline;font-weight:bold;">Log In</a></div>
      </div>
    </div>
  </div>
</body>
</html>
