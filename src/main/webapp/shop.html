<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bites & More — Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wire-page">
  <!-- Gọi HEADER giống file index.html (Chỉ cần chỉnh thuộc tính gạch chân ở chữ Shop) -->
  <div class="wf-topbar">FREE DELIVERY ON ORDERS OVER $50</div>
  <div class="wf-header">
    <div class="wf-logo">BITES &amp; MORE</div>
    <nav class="wf-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" style="text-decoration:underline;">Shop</a>
      <a href="blog.html">Blog</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <span>Home</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000"><polyline points="9,6 15,12 9,18"/></svg>
    <span>Shop</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000"><polyline points="9,6 15,12 9,18"/></svg>
    <span>All Products</span>
  </div>

  <!-- MAIN SHOP CONTENT -->
  <div class="section" style="padding:40px 80px;">
    <div class="row">
      <!-- Cột trái: Bộ lọc (Filter) -->
      <div class="col-3">
        <div class="filter-block">
          <h5>Search</h5>
          <div class="input" style="display:flex;align-items:center;gap:8px;color:#777;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 
            Search products...
          </div>
        </div>
        <div class="filter-block">
          <h5>Category</h5>
          <div class="filter-row"><span class="checkbox"></span>Breads</div>
          <div class="filter-row"><span class="checkbox"></span>Cakes</div>
          <div class="filter-row"><span class="checkbox"></span>Pastries</div>
        </div>
        <div class="filter-block">
          <h5>Price Range</h5>
          <div style="display:flex;gap:10px;margin-bottom:14px;">
            <input class="input" placeholder="Min">
            <input class="input" placeholder="Max">
          </div>
          <div class="img-ph" style="height:8px;"></div>
        </div>
        <div class="btn btn-dark btn-block">Apply Filters</div>
      </div>

      <!-- Cột phải: Danh sách Sản phẩm -->
      <div class="col-9">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
          <div style="font-size:14px;color:#444;">Showing 1-8 of 42 results</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:13px;font-weight:bold;">Sort By:</span>
            <div class="input" style="width:220px;display:flex;justify-content:space-between;align-items:center;">
              Popularity 
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000"><polyline points="6,9 12,15 18,9"/></svg>
            </div>
          </div>
        </div>
        
        <!-- Grid Sản phẩm -->
        <div class="row">
          <!-- Lặp lại các cấu trúc <div class="col-3"><div class="product-card">...</div></div> giống bên file index -->
        </div>

        <!-- PAGINATION (Phân trang) -->
        <div class="pagination">
          <div class="page-num"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000"><polyline points="15,6 9,12 15,18"/></svg></div>
          <div class="page-num active">1</div>
          <div class="page-num">2</div>
          <div class="page-num">3</div>
          <div class="page-num"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000"><polyline points="9,6 15,12 9,18"/></svg></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Gọi FOOTER giống file index.html -->
</div>
</body>
</html>
